{% extends "base.html" %}


{% block title %}
Login - AI Price Tracker
{% endblock %}



{% block content %}


<div class="auth-box">


<h1>
🔐 Login
</h1>


<form method="POST">


<label>
Email
</label>


<input 
type="email"
name="email"
placeholder="Enter your email"
required>



<label>
Password
</label>


<input 
type="password"
name="password"
placeholder="Enter your password"
required>



<button type="submit">

Login

</button>


</form>



<p>

Don't have an account?

<a href="{{ url_for('auth.register') }}">

Register

</a>


</p>



</div>


{% endblock %}
